name: Generate README

on:
  workflow_dispatch:
  push:
    paths:
      - CONTENT.md
      - .github/docs-config.yml

permissions:
  contents: write

jobs:
  readme:
    uses: intisy/workflows/.github/workflows/readme.yml@main
    with:
      repository: ${{ github.repository }}
    secrets:
      envPAT: ${{ secrets.PAT }}
